<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">Codex Kiro 本地接入架构</title><desc id="desc">Codex 原生模型使用 OpenAI 账号；Kiro 模型通过本地网关及 Kiro CLI 使用公司账号。工具由 Codex 执行。</desc>
